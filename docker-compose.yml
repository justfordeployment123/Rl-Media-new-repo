version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: rl-media-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
    volumes:
      # Persist password file so changes survive container restarts
      - ./server/password.json:/app/server/password.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3001/api/password-status"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

